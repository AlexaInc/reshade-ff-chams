name: memory-fingerprint-probe
on:
  push:
    branches: [agent/memory-fingerprint-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test bounded scanner and separate add-on
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:bounded_fingerprint_scan_test.exe tests\bounded_fingerprint_scan_test.cpp
          if errorlevel 1 exit /b %errorlevel%
          bounded_fingerprint_scan_test.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD source\memory_fingerprint_addon.cpp /link /OUT:MemoryFingerprintProbe.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:fingerprint_mock_host.exe tests\fingerprint_mock_host.cpp
          if errorlevel 1 exit /b %errorlevel%
          fingerprint_mock_host.exe
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryFingerprintProbe-addon
          path: MemoryFingerprintProbe.addon64
          if-no-files-found: error
