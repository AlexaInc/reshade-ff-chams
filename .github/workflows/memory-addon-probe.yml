name: memory-addon-probe
on:
  push:
    branches: [agent/memory-addon-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test standalone add-on (no ReShade replacement)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD source\memory_addon.cpp /link /OUT:MemoryIdentityProbe.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:memory_addon_mock_host.exe tests\mock_addon_host.cpp
          if errorlevel 1 exit /b %errorlevel%
          memory_addon_mock_host.exe
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryIdentityProbe-selftest-addon
          path: MemoryIdentityProbe.addon64
          if-no-files-found: error
