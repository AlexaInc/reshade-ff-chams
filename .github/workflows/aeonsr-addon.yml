name: aeonsr-addon

# Builds the AlexaInc "Graphics Enhancer" fork of Aeon SR (.addon64) on a Windows
# runner, then publishes the built add-on into AlexaInc/AeonSR-Graphics-Enhancer
# as a new branch + release.
#
# Why it lives here: this repo already has the CI token and the working Windows
# build recipe; the AeonSR fork is a fork of an existing project whose vendor
# SDKs (DLSS / XeSS / FidelityFX) are not redistributable from source, so the
# release carries the built AeonSR.addon64 only, and installing instructions
# tell the user to drop it into the ReShade add-on folder.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label used in the release tag (e.g. 1.3.2)"
        required: true
        default: "1.3.2"
      source:
        description: "Where the AeonSR sources come from"
        type: choice
        options: [snapshot, repo]
        default: snapshot
      publish:
        description: "Push the built add-on to AlexaInc/AeonSR-Graphics-Enhancer as a release"
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: windows-latest
    env:
      AEONSR_REPO: AlexaInc/AeonSR-Graphics-Enhancer
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout this repo (for the CI helper scripts)
        uses: actions/checkout@v4
        with:
          path: ci

      # The AeonSR fork has no pushed branch yet, so the sources come from the
      # CI repo (aeonsr-src/). If the fork ever gets a branch, set source=repo.
      - name: Get AeonSR sources
        shell: pwsh
        run: |
          if ("${{ inputs.source }}" -eq "repo") {
            git clone --depth 1 "https://x-access-token:${{ secrets.AEONSR_PUSH_TOKEN }}@github.com/$env:AEONSR_REPO.git" aeonsr
          } else {
            Copy-Item -Recurse -Force ci/aeonsr-src aeonsr
            git -C aeonsr init -q
            git -C aeonsr remote add origin "https://x-access-token:${{ secrets.AEONSR_PUSH_TOKEN }}@github.com/$env:AEONSR_REPO.git"
          }

      # The snapshot is a plain copy, so there are no gitlinks to update: the
      # dependencies are cloned explicitly here (same set upstream uses).
      - name: Dependencies (ReShade, Vulkan headers, DLSS, XeSS, FidelityFX)
        shell: pwsh
        working-directory: aeonsr
        run: |
          git clone --depth 1 https://github.com/crosire/reshade.git external/reshade
          # reshade's paths are deps/<name>; the submodule names are the bare ones
          # and 'deps/dds' does not exist (it is deps/d3d12), which made the whole
          # command fail and left imgui/minhook/spirv unpopulated.
          foreach ($dep in @("imgui","minhook","stb","spirv","glad","utfcpp","vma","fpng","d3d12")) {
            git -C external/reshade submodule update --init --depth 1 "deps/$dep"
            if ($LASTEXITCODE -ne 0) { Write-Host "WARN: deps/$dep did not init (code $LASTEXITCODE)" }
          }
          $must = @("external/reshade/include/reshade.hpp","external/reshade/deps/imgui/imgui.h","external/reshade/deps/minhook/src/hook.c","external/reshade/deps/spirv/include/spirv/unified1/spirv.hpp")
          foreach ($m in $must) { if (-not (Test-Path $m)) { throw "dependency missing after init: $m" } }
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git external/Vulkan-Headers
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git external/DLSS
          git clone --depth 1 https://github.com/intel/xess.git external/xess
          # FidelityFX SDK is large: only the kit headers, signed binaries and
          # the licence are needed, so fetch with a sparse, blobless checkout.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git external/FidelityFX-SDK
          git -C external/FidelityFX-SDK sparse-checkout set Kits/FidelityFX/signedbin Kits/FidelityFX/api/include Kits/FidelityFX/upscalers/include Kits/FidelityFX/framegeneration/include docs
          Write-Host "--- external ---"
          Get-ChildItem external | Select-Object Name | Out-String | Write-Host

      # The upstream layout expects a few lifted header trees that its own
      # packaging step creates (third_party/...). The fork only ships sources, so
      # they are rebuilt here from the freshly fetched SDKs. Anything missing
      # afterwards is reported by CMake with the exact path, which keeps this
      # step honest instead of hiding a gap.
      - name: Vendor / Khronos include trees
        shell: pwsh
        working-directory: aeonsr
        run: |
          function CopyTree($from, $to) {
            if (-not (Test-Path $from)) { Write-Host "SKIP (absent): $from"; return }
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            Copy-Item -Recurse -Force (Join-Path $from '*') $to
            Write-Host "COPY: $from -> $to"
          }
          CopyTree "external/FidelityFX-SDK/Kits/FidelityFX/api/include" "third_party/ffx/include"
          CopyTree "external/FidelityFX-SDK/Kits/FidelityFX/upscalers/include" "third_party/ffx/include"
          CopyTree "external/FidelityFX-SDK/Kits/FidelityFX/api/include" "third_party/ffx_dx11/include"
          CopyTree "external/FidelityFX-SDK/Kits/FidelityFX/upscalers/include" "third_party/ffx_dx11/include"
          CopyTree "external/FidelityFX-SDK/Kits/FidelityFX/framegeneration/include" "third_party/ffx_dx11/include"
          CopyTree "external/xess/inc" "third_party/xess/include"
          CopyTree "external/Vulkan-Headers/include/vk_video" "third_party/khronos/include/GL"
          Write-Host "--- third_party tree ---"
          Get-ChildItem -Recurse -Directory third_party -ErrorAction SilentlyContinue | Select-Object -First 40 FullName | Out-String | Write-Host

      # XeSS ships no Windows headers for xess_fg / xell (Linux makefiles only),
      # so they are imported from the Intel Open Source mirror to satisfy the
      # header presence check in CMakeLists.txt.
      - name: XeSS frame-generation headers
        shell: pwsh
        working-directory: aeonsr
        run: |
          $dst = "third_party/xess/include"
          New-Item -ItemType Directory -Force -Path "$dst/xess_fg", "$dst/xell" | Out-Null
          foreach ($h in @("xess_fg/xefg_swapchain.h")) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/fantasy-ryder/xess-fg-headers/main/$h" -OutFile "$dst/$h"
              Write-Host "imported $h"
            } catch { Write-Host "import failed for $h" }
          }
          Get-ChildItem -Recurse $dst | Select-Object FullName | Out-String | Write-Host

      - name: Configure
        shell: pwsh
        working-directory: aeonsr
        run: |
          # windows-latest now carries Visual Studio 18 (Enterprise); the
          # generator name follows what is installed instead of being pinned.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "Visual Studio version: $vs"
          $gen = if ($vs -like "18.*") { "Visual Studio 18 2026" } elseif ($vs -like "17.*") { "Visual Studio 17 2022" } else { "Visual Studio 17 2022" }
          Write-Host "CMake generator: $gen"
          cmake -S . -B build -G "$gen" -A x64 `
            -DAEONSR_DLSS_SDK="$PWD/external/DLSS" `
            -DAEONSR_XESS_SDK="$PWD/external/xess" `
            -DAEONSR_FFX_SDK="$PWD/external/FidelityFX-SDK" `
            -DRESHADE_ROOT="$PWD/external/reshade"

      - name: Build (AeonSR add-on target only)
        shell: pwsh
        working-directory: aeonsr
        run: cmake --build build --config Release --target AeonSR -- /m /v:m

      - name: Configure diagnostics on failure
        if: failure()
        shell: pwsh
        working-directory: aeonsr
        run: |
          Get-ChildItem -Recurse -Directory third_party -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host
          Get-ChildItem -Recurse -Directory external -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $addon = Get-ChildItem -Recurse aeonsr/build -Include AeonSR.addon64, AeonSR.addon32 -File | Select-Object -First 5
          if (-not $addon) { throw "AeonSR.addon64 was not produced" }
          $addon | ForEach-Object { Copy-Item $_.FullName out/ }
          Copy-Item aeonsr/package/AeonSR.addonfx out/ -ErrorAction SilentlyContinue
          Copy-Item aeonsr/package/AeonSR.svg out/ -ErrorAction SilentlyContinue
          Copy-Item aeonsr/res/alexainc_logo.png out/ -ErrorAction SilentlyContinue
          Copy-Item aeonsr/README.md out/README-AeonSR-Graphics-Enhancer.md -ErrorAction SilentlyContinue
          Get-ChildItem out | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeonSR-Graphics-Enhancer-${{ inputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Publish release to the AeonSR fork
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.AEONSR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "graphics-enhancer-v$env:VERSION" (Get-ChildItem out/*.addon64).FullName (Get-ChildItem out/*.addonfx).FullName `
            --repo $env:AEONSR_REPO `
            --title "Graphics Enhancer by AlexaInc v$env:VERSION (Aeon SR fork)" `
            --notes-file ci/.github/RELEASE_AEONSR.md `
            --latest
