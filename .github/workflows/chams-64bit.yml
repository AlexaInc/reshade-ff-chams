name: chams-64bit

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Setup glad Python path
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\deps\glad\src;${env:PYTHONPATH}"
          echo "PYTHONPATH=$env:PYTHONPATH" >> $env:GITHUB_ENV
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: ReShade64-chams
          path: ReShade64.dll
