name: chams-64bit

on:
  push:
    branches: [main, agent/chams-investigation-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-rendering-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Chams GL logic with mock dispatch
        run: python3 tests/run_mock_gl_tests.py
      - name: Test config validation
        run: |
          g++ -std=c++17 tests/chams_config_validation_test.cpp -o /tmp/chams-config-validation-test
          printf '[CHAMS]\nEnabled=1\nGlowAlpha=0.55\n' > /tmp/chams-validation.ini
          /tmp/chams-config-validation-test /tmp/chams-validation.ini
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test Windows settings persistence
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools not found" }
          $cmd = 'call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul && cl /nologo /std:c++17 /EHsc /DNOMINMAX /Ideps\utfcpp\source tests\chams_config_windows_test.cpp source\ini_file.cpp /Fe:chams-config-test.exe /link User32.lib Shell32.lib && chams-config-test.exe'
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build 64-bit Release
        run: msbuild ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: ReShade64-chams
          path: bin/x64/Release/ReShade64.dll
          if-no-files-found: error
