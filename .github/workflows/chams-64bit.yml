name: chams-64bit
on:
  push:
    branches: [ main, chams-investigation-build, agent/chams-investigation-build ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: ReShade64-chams
          path: bin/x64/Release/ReShade64.dll
          if-no-files-found: error
