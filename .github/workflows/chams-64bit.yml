name: chams-64bit

on:
  push:
    branches: [main, agent/chams-investigation-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build 64-bit Release
        run: msbuild ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: ReShade64-chams
          path: bin/x64/Release/ReShade64.dll
          if-no-files-found: error
