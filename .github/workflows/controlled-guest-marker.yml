name: targeted-guest-marker
on:
  push:
    branches: [agent/guest-marker-targeted]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exercise controlled guest marker on Linux
        run: python3 tests/guest_marker_test.py
      - name: Build Android arm64 executable using installed NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:?Android NDK not found}"
          compiler="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          "$compiler" -std=c++17 -O2 -Wall -Wextra -Werror -static-libstdc++ source/guest_marker.cpp -o GuestMarker-arm64
          file GuestMarker-arm64
          sha256sum GuestMarker-arm64
          compiler_x86="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++"
          "$compiler_x86" -std=c++17 -O2 -Wall -Wextra -Werror -static-libstdc++ source/guest_marker.cpp -o GuestMarker-x86_64
          file GuestMarker-x86_64
          sha256sum GuestMarker-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: GuestMarker-arm64
          path: GuestMarker-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GuestMarker-x86_64
          path: GuestMarker-x86_64
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test marker parser, scanner and add-on
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:controlled_marker_scan_test.exe tests\controlled_marker_scan_test.cpp
          if errorlevel 1 exit /b %errorlevel%
          controlled_marker_scan_test.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD source\controlled_marker_addon.cpp /link /OUT:TargetedMarkerProbe.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD /DMARKER_TEST source\controlled_marker_addon.cpp /link /OUT:MarkerTest.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:controlled_marker_mock_host.exe tests\controlled_marker_mock_host.cpp
          if errorlevel 1 exit /b %errorlevel%
          controlled_marker_mock_host.exe
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        with:
          name: TargetedMarkerProbe-addon
          path: TargetedMarkerProbe.addon64
          if-no-files-found: error
