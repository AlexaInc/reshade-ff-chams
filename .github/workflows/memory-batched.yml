name: memory-fingerprint-batched
on:
  push:
    branches: [agent/memory-batched-continuation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test bounded scanner and batch add-on
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:bounded_fingerprint_scan_test.exe tests\bounded_fingerprint_scan_test.cpp
          if errorlevel 1 exit /b %errorlevel%
          bounded_fingerprint_scan_test.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD source\memory_batch_addon.cpp /link /OUT:MemoryBatchProbe.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /LD /DMEMORY_BATCH_TEST source\memory_batch_addon.cpp /link /OUT:MemoryBatchTest.addon64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /Fe:batch_mock_host.exe tests\batch_mock_host.cpp
          if errorlevel 1 exit /b %errorlevel%
          batch_mock_host.exe
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryBatchProbe-addon
          path: MemoryBatchProbe.addon64
          if-no-files-found: error
