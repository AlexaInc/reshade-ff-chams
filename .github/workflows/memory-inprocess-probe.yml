name: memory-inprocess-probe
on:
  push:
    branches: [agent/memory-inprocess-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Compile and execute self-read test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 /W4 /WX /Fe:chams_inprocess_probe_test.exe tests\chams_inprocess_probe_test.cpp
          if errorlevel 1 exit /b %errorlevel%
          chams_inprocess_probe_test.exe
          if errorlevel 1 exit /b %errorlevel%
      - name: Build diagnostic ReShade
        run: msbuild ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: ReShade64-inprocess-self-read-diagnostic
          path: bin/x64/Release/ReShade64.dll
          if-no-files-found: error
